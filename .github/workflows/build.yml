name: build
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


jobs:
  GCCBuild:
    name: ${{ matrix.config.name }} Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Ubuntu GCC Debug",
            config: "Debug",
            lowerCase: "debug",
          }
        - {
            name: "Ubuntu GCC Release",
            config: "Release",
            lowerCase: "release",
          }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true
      - name: Cache apt packages
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-xorg-uuid
      - name: update
        run: |
          # Remove Microsoft repos that have signing issues on GitHub-hosted ubuntu-latest runners
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt update
      - name: Set compiler
        run: |
          sudo apt-get install -y g++-14
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
      - name: Get X11
        run: sudo apt-get install xorg-dev
      - name: Get uuid
        run: sudo apt-get install uuid-dev
      - name: Premake
        run: |
            sudo chmod +x Tools/Premake5/premake5
            sudo Tools/Premake5/premake5 gmake2
      - name: Build
        run: make config=${{ matrix.config.lowerCase }} -j6
      - name: Copy TestData
        run: |
          for test in Core Renderer Utils Physics; do
            if [ -d "Tests/$test/TestData" ]; then
              cp -r "Tests/$test/TestData" "bin/${{ matrix.config.config }}-linux-x86_64/${test}Test/"
            fi
          done
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ubuntu-${{ matrix.config.config }}-Tests
          path: bin/${{ matrix.config.config }}-linux-x86_64/
          retention-days: 1
  GCCTest:
    name: ${{ matrix.config.name }} Test ${{ matrix.test }}
    needs: GCCBuild
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Ubuntu GCC Debug",
            config: "Debug",
            lowerCase: "debug",
          }
        - {
            name: "Ubuntu GCC Release",
            config: "Release",
            lowerCase: "release",
          }
        test: ["CoreTest", "RendererTest", "UtilsTest", "PhysicsTest"] #, "EntityTest"]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Ubuntu-${{ matrix.config.config }}-Tests
      - name: Test ${{ matrix.config.test }}
        run: |
            sudo chmod +x ${{ matrix.test }}/${{ matrix.test }}
            mkdir -p ${{ matrix.test }}/TestData
            cd ${{ matrix.test }}/TestData
            ./../${{ matrix.test }}
  msvc:
    name: MSVC api=${{ matrix.glfwapi }} config=${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
        glfwapi: [opengl, vulkan]
    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true
      - name: Generate solution
        shell: cmd
        run: Tools\Premake5\premake5.exe --glfwapi=${{ matrix.glfwapi }} vs2022
      - name: Build
        shell: cmd
        run: msbuild Engine.sln /p:Configuration=${{ matrix.configuration }} -maxCpuCount
      - name: Copy TestData
        shell: cmd
        run: |
          if exist "Tests\Core\TestData" xcopy /E /I /Y "Tests\Core\TestData" "bin\${{ matrix.configuration }}-windows-x86_64\CoreTest\TestData\"
          if exist "Tests\Renderer\TestData" xcopy /E /I /Y "Tests\Renderer\TestData" "bin\${{ matrix.configuration }}-windows-x86_64\RendererTest\TestData\"
          if exist "Tests\Utils\TestData" xcopy /E /I /Y "Tests\Utils\TestData" "bin\${{ matrix.configuration }}-windows-x86_64\UtilsTest\TestData\"
          if exist "Tests\Physics\TestData" xcopy /E /I /Y "Tests\Physics\TestData" "bin\${{ matrix.configuration }}-windows-x86_64\PhysicsTest\TestData\"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Windows-${{ matrix.configuration }}-${{ matrix.glfwapi }}-Tests
          path: bin\${{ matrix.configuration }}-windows-x86_64/
          retention-days: 1
  msvcTest:
    name: MSVC config=${{ matrix.configuration }} ${{ matrix.test }} # once dependant on API add it here
    runs-on: windows-latest
    needs: msvc
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
        # glfwapi: [opengl, vulkan] not yet dependent on API
        test: ["CoreTest", "RendererTest", "UtilsTest", "PhysicsTest"] #, "EntityTest"]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Windows-${{ matrix.configuration }}-opengl-Tests # API goes here
      - name: Test
        shell: cmd
        run: |
            if not exist "${{ matrix.test }}\TestData" mkdir "${{ matrix.test }}\TestData"
            cd ${{ matrix.test }}\TestData
            ..\${{ matrix.test }}.exe
